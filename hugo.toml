baseURL = "https://zevorn.cn/"
title = "zevorn.blog"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
summaryLength = 120

[pagination]
pagerSize = 12

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
tag = "tags"
category = "categories"

[markup]
    [markup.highlight]
    noClasses = false
    lineNos = true
    lineNumbersInTable = false
    style = "github-dark"

    [markup.goldmark]
        [markup.goldmark.renderer]
        unsafe = true

[params]
env = "production"
title = "zevorn.blog"
description = "Notes on virtualization, QEMU, RISC-V, LLVM, systems programming, and AI workflows."
keywords = ["QEMU", "RISC-V", "LLVM", "virtualization", "systems programming", "AI workflow"]
author = "zevorn"
images = ["avatar.webp"]
DateFormat = "2006-01-02"
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowToc = true
TocOpen = false
UseHugoToc = true
comments = true

[params.assets]
favicon = "favicon.ico"
favicon16x16 = "icon/favicon-16x16.png"
favicon32x32 = "icon/favicon-32x32.png"
apple_touch_icon = "icon/apple-touch-icon.png"

[params.homeInfoParams]
Title = "zevorn.blog"
Content = "Technical notes on virtualization, QEMU, RISC-V, LLVM, systems programming, and practical AI workflows."

[[params.socialIcons]]
name = "github"
url = "https://github.com/zevorn"

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "archives"
name = "Archive"
url = "/archives/"
weight = 20

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 30

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 40

[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 50

[module]
    [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"
