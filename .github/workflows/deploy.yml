name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  discussion:
    types:
      - created
      - edited
      - deleted
      - labeled
      - unlabeled
      - category_changed
  label:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore exported discussion cache
        uses: actions/cache/restore@v4
        with:
          path: |
            content/posts
            static/images/discussions
          key: discussions-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            discussions-

      - name: Export GitHub Discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_REPOSITORY: zevorn/blog
        run: npm run sync:discussions

      - name: Build Hugo site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Save exported discussion cache
        uses: actions/cache/save@v4
        with:
          path: |
            content/posts
            static/images/discussions
          key: discussions-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
